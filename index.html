<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Rocket Arena</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080f20;color:#eef6ff;font-family:system-ui,Arial;display:flex;justify-content:center}
main{width:min(100%,900px);padding:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
h1{margin:0;color:#67e8f9;font-size:clamp(22px,5vw,34px);letter-spacing:2px}
button{border:1px solid #5279a8;background:#17365b;color:white;border-radius:12px;padding:12px 16px;font-weight:800;font-size:15px;touch-action:none}
button:active{background:#28639a}.arena{position:relative;margin-top:12px;border:1px solid #31527c;border-radius:14px;overflow:hidden;background:#101d39}
canvas{display:block;width:100%;height:auto;touch-action:none}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px;background:#050b18df;gap:12px}
#overlay h2{font-size:clamp(28px,7vw,46px);margin:0;color:#67e8f9}
.stats{display:flex;justify-content:space-between;gap:12px;margin:10px 0;font-weight:700}.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;align-items:center}.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.pad button{padding:12px 4px}.actions{display:grid;gap:8px}.hint{color:#a9bdd8;font-size:13px}
</style>
</head>
<body><main>
<div class="top"><h1>🚀 ROCKET ARENA</h1><button id="restart">↻ Restart</button></div>
<div class="stats"><span id="php">❤️ YOU: 100</span><span id="score">YOU 0 — BOT 0</span><span id="bhp">🤖 BOT: 100</span></div>
<div class="arena"><canvas id="game" width="800" height="480"></canvas><div id="overlay"><h2>ROCKET ARENA</h2><div>Battle the bot • Dodge • Shoot • Win!</div><button id="start">▶ START BATTLE</button><div class="hint">Touch controls or WASD / arrow keys. Space fires.</div></div></div>
<div class="controls" style="margin-top:12px">
<div class="pad">
<span></span><button data-dir="up">⬆️</button><span></span>
<button data-dir="left">⬅️</button><button data-dir="down">⬇️</button><button data-dir="right">➡️</button>
</div>
<div class="hint" style="text-align:center">Move around the arena<br>and aim toward the bot.</div>
<div class="actions"><button id="fire">🔥 FIRE</button><button id="rocket">🚀 ROCKET</button></div>
</div>
<p class="hint">Pickups appear during battle: green = health, yellow = speed, purple = stronger shots.</p>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id);
const W=800,H=480;let player,bot,bullets,pickups,keys={},touch={},running=false,score=0,botScore=0,last=0,fireWait=0,rocketWait=0,pickWait=0,over=false;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function reset(){player={x:135,y:240,hp:100,angle:0,speed:3.2,power:0};bot={x:665,y:240,hp:100,angle:Math.PI};bullets=[];pickups=[];fireWait=rocketWait=0;pickWait=180;running=true;over=false;$('overlay').style.display='none';}
function finish(winner){if(over)return;over=true;running=false;if(winner==='player')score++;else botScore++;$('score').textContent=`YOU ${score} — BOT ${botScore}`;$('overlay').innerHTML=`<h2 style="color:${winner==='player'?'#86efac':'#fda4af'}">${winner==='player'?'YOU WIN! 🎉':'BOT WINS!'}</h2><div>Score: ${score} — ${botScore}</div><button id="again">PLAY AGAIN</button>`;$('overlay').style.display='flex';$('again').onclick=reset;}
function fire(owner,rocket=false){if(!running)return;let o=owner==='player'?player:bot;bullets.push({x:o.x+Math.cos(o.angle)*22,y:o.y+Math.sin(o.angle)*22,angle:o.angle,owner,speed:rocket?7.2:9,damage:rocket?32:(o.power>0?18:12),life:rocket?90:65,r:rocket?8:4});}
function ship(o,color){ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.angle);ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(24,0);ctx.lineTo(-16,-13);ctx.lineTo(-9,0);ctx.lineTo(-16,13);ctx.closePath();ctx.fill();ctx.fillStyle='#e8f5ff';ctx.fillRect(-7,-4,9,8);ctx.restore();}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#101d39';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#1d3458';for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
ctx.fillStyle='#243e65';[[255,105,70,70],[475,305,90,65],[365,190,55,55]].forEach(a=>ctx.fillRect(...a));
pickups.forEach(p=>{ctx.fillStyle=p.type==='health'?'#4ade80':p.type==='speed'?'#facc15':'#c084fc';ctx.beginPath();ctx.arc(p.x,p.y,12,0,Math.PI*2);ctx.fill();ctx.fillStyle='#07101e';ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.fillText(p.type==='health'?'＋':p.type==='speed'?'»':'✦',p.x,p.y+5)});
bullets.forEach(b=>{ctx.fillStyle=b.owner==='player'?'#8df5ff':'#ff9c76';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill()});
ship(player,'#22d3ee');ship(bot,'#fb7185');
ctx.fillStyle='#fff';ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.fillText('YOU',player.x,player.y-27);ctx.fillText('BOT',bot.x,bot.y-27);
}
function update(dt){if(!running)return;
let dx=(touch.right||keys.ArrowRight||keys.d?1:0)-(touch.left||keys.ArrowLeft||keys.a?1:0),dy=(touch.down||keys.ArrowDown||keys.s?1:0)-(touch.up||keys.ArrowUp||keys.w?1:0),len=Math.hypot(dx,dy)||1;
player.x=clamp(player.x+dx/len*player.speed*dt,24,W-24);player.y=clamp(player.y+dy/len*player.speed*dt,24,H-24);
player.angle=Math.atan2(bot.y-player.y,bot.x-player.x);
let a=Math.atan2(player.y-bot.y,player.x-bot.x),dist=Math.hypot(player.x-bot.x,player.y-bot.y),move=dist>230?1:dist<145?-0.65:0.25;
bot.angle=a;bot.x=clamp(bot.x+Math.cos(a)*1.75*move*dt,24,W-24);bot.y=clamp(bot.y+Math.sin(a)*1.75*move*dt,24,H-24);
fireWait-=dt;rocketWait-=dt;pickWait-=dt;
if(fireWait<=0){fire('bot');fireWait=44+Math.random()*25;}
if(pickWait<=0&&pickups.length<2){pickups.push({x:70+Math.random()*660,y:60+Math.random()*360,type:['health','speed','power'][Math.floor(Math.random()*3)]});pickWait=1000;}
bullets.forEach(b=>{b.x+=Math.cos(b.angle)*b.speed*dt;b.y+=Math.sin(b.angle)*b.speed*dt;b.life-=dt;let target=b.owner==='player'?bot:player;if(Math.hypot(b.x-target.x,b.y-target.y)<21){target.hp=clamp(target.hp-b.damage,0,100);b.life=0;}});
bullets=bullets.filter(b=>b.life>0&&b.x>0&&b.x<W&&b.y>0&&b.y<H);
pickups=pickups.filter(p=>{if(Math.hypot(p.x-player.x,p.y-player.y)<24){if(p.type==='health')player.hp=clamp(player.hp+35,0,100);if(p.type==='speed')player.speed=4.8;if(p.type==='power')player.power=500;return false;}if(Math.hypot(p.x-bot.x,p.y-bot.y)<24){if(p.type==='health')bot.hp=clamp(bot.hp+25,0,100);return false;}return true;});
player.power=Math.max(0,player.power-dt);
if(player.hp<=0)finish('bot');if(bot.hp<=0)finish('player');
$('php').textContent=`❤️ YOU: ${player.hp}`;$('bhp').textContent=`🤖 BOT: ${bot.hp}`;
}
function loop(t){let dt=Math.min((t-last)/16.67||1,2);last=t;update(dt);draw();requestAnimationFrame(loop);}
$('start').onclick=reset;$('restart').onclick=reset;$('fire').onpointerdown=e=>{e.preventDefault();fire('player')};$('rocket').onpointerdown=e=>{e.preventDefault();if(rocketWait<=0){fire('player',true);rocketWait=38;}};
document.querySelectorAll('[data-dir]').forEach(btn=>{let d=btn.dataset.dir;btn.onpointerdown=e=>{e.preventDefault();touch[d]=true};btn.onpointerup=btn.onpointerleave=btn.onpointercancel=()=>touch[d]=false;});
window.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' '){e.preventDefault();fire('player')}});window.addEventListener('keyup',e=>keys[e.key]=false);
player={x:135,y:240,hp:100,angle:0,speed:3.2,power:0};bot={x:665,y:240,hp:100,angle:Math.PI};bullets=[];pickups=[];draw();requestAnimationFrame(loop);
})();
</script>
</body></html>
